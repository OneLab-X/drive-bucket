<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Background","default":"#E9EEF3"},
    {"id":"color-ink","type":"color","label":"Text","default":"#0E1B2A"},
    {"id":"color-accent","type":"color","label":"Accent (the photo path)","default":"#E0441A"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>How drivebucket works</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --color-ground: #e9eef3;
        --color-ink: #0e1b2a;
        --color-accent: #e0441a;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--color-ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: "Outfit", sans-serif;
        color: var(--color-ink);
      }
      #ground {
        position: absolute;
        inset: 0;
        background: var(--color-ground);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="54"
      data-width="1920"
      data-height="1080"
    >
      <div id="ground"></div>

      <!-- Scenes: one photo's round trip -->
      <div id="s1-hook" data-composition-id="s1-hook" data-composition-src="compositions/s1-hook.html"
        data-start="0" data-duration="5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s2-resize" data-composition-id="s2-resize" data-composition-src="compositions/s2-resize.html"
        data-start="5" data-duration="5.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s3-stream" data-composition-id="s3-stream" data-composition-src="compositions/s3-stream.html"
        data-start="10.5" data-duration="6.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s4-drive" data-composition-id="s4-drive" data-composition-src="compositions/s4-drive.html"
        data-start="17" data-duration="9" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s5-db" data-composition-id="s5-db" data-composition-src="compositions/s5-db.html"
        data-start="26" data-duration="5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s6-read" data-composition-id="s6-read" data-composition-src="compositions/s6-read.html"
        data-start="31" data-duration="11" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s7-s3" data-composition-id="s7-s3" data-composition-src="compositions/s7-s3.html"
        data-start="42" data-duration="6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s8-end" data-composition-id="s8-end" data-composition-src="compositions/s8-end.html"
        data-start="48" data-duration="6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <!-- Sound effects (bundled library). Each starts so its measured peak lands 1 frame after the picture. -->
      <audio id="sfx-photo-land" src=".media/audio/sfx/sfx_001.mp3" data-start="1.11" data-duration="0.72" data-volume="0.6" data-track-index="2"></audio>
      <audio id="sfx-upload-done" src=".media/audio/sfx/sfx_002.mp3" data-start="2.66" data-duration="0.37" data-volume="0.8" data-track-index="3"></audio>
      <audio id="sfx-push-photo" src=".media/audio/sfx/sfx_003.mp3" data-start="4.82" data-duration="0.58" data-volume="0.45" data-track-index="2"></audio>
      <audio id="sfx-resize-tag" src=".media/audio/sfx/sfx_001.mp3" data-start="7.51" data-duration="0.72" data-volume="0.45" data-track-index="3"></audio>
      <audio id="sfx-stream" src=".media/audio/sfx/sfx_004.mp3" data-start="11.37" data-duration="0.58" data-volume="0.4" data-track-index="2"></audio>
      <audio id="sfx-sniff-ok" src=".media/audio/sfx/sfx_001.mp3" data-start="13.61" data-duration="0.72" data-volume="0.6" data-track-index="3"></audio>
      <audio id="sfx-push-folder" src=".media/audio/sfx/sfx_003.mp3" data-start="16.82" data-duration="0.58" data-volume="0.45" data-track-index="2"></audio>
      <audio id="sfx-file-drop" src=".media/audio/sfx/sfx_002.mp3" data-start="18.76" data-duration="0.37" data-volume="0.8" data-track-index="3"></audio>
      <audio id="sfx-flip" src=".media/audio/sfx/sfx_004.mp3" data-start="22.27" data-duration="0.58" data-volume="0.35" data-track-index="2"></audio>
      <audio id="sfx-md5-ok" src=".media/audio/sfx/sfx_006.mp3" data-start="23.71" data-duration="1.32" data-volume="0.5" data-track-index="3"></audio>
      <audio id="sfx-key-1" src=".media/audio/sfx/sfx_005.mp3" data-start="27.36" data-duration="0.4" data-volume="1" data-track-index="2"></audio>
      <audio id="sfx-key-2" src=".media/audio/sfx/sfx_005.mp3" data-start="27.52" data-duration="0.4" data-volume="1" data-track-index="3"></audio>
      <audio id="sfx-request-1" src=".media/audio/sfx/sfx_003.mp3" data-start="31.85" data-duration="0.58" data-volume="0.35" data-track-index="2"></audio>
      <audio id="sfx-cost-200" src=".media/audio/sfx/sfx_006.mp3" data-start="33.31" data-duration="1.32" data-volume="0.55" data-track-index="3"></audio>
      <audio id="sfx-request-2" src=".media/audio/sfx/sfx_003.mp3" data-start="37.05" data-duration="0.58" data-volume="0.3" data-track-index="2"></audio>
      <audio id="sfx-cost-0" src=".media/audio/sfx/sfx_001.mp3" data-start="37.61" data-duration="0.72" data-volume="0.55" data-track-index="3"></audio>
      <audio id="sfx-push-server" src=".media/audio/sfx/sfx_004.mp3" data-start="41.82" data-duration="0.58" data-volume="0.45" data-track-index="2"></audio>
      <audio id="sfx-typing" src=".media/audio/sfx/sfx_007.mp3" data-start="43.88" data-duration="1.5" data-volume="0.9" data-track-index="3"></audio>
      <audio id="sfx-name" src=".media/audio/sfx/sfx_008.mp3" data-start="49.16" data-duration="2.12" data-volume="0.3" data-track-index="2"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
