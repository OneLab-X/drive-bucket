version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      aws-sdk: { patterns: ['@aws-sdk/*'] }
      dev: { dependency-type: development }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
