# Copy to docker-compose.yml, fill .env (see .env.example), then: docker compose up -d
# Put a CDN (e.g. Cloudflare) in front of port 8080 for anything public.
services:
  drivebucket:
    build: .
    image: drivebucket:latest
    ports: ["8080:8080"]
    env_file: .env
    environment:
      DRIVEBUCKET_REDIS_URL: redis://redis:6379
      DRIVEBUCKET_PUBLIC_BUCKETS: photos
      DRIVEBUCKET_RESIZE_WIDTHS: "320,640,1280,1920"
      DRIVEBUCKET_TRUST_PROXY: "true"
      DRIVEBUCKET_MULTIPART_DIR: /var/cache/drivebucket/mpu
    volumes:
      - resize-cache:/var/cache/drivebucket
    depends_on: [redis]
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped
volumes:
  resize-cache:
